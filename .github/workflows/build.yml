name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APK_OUTPUT_DIR: ${{ github.workspace }}/output
      KEYSTORE_FILE: ${{ github.workspace }}/.keystore/jointdebugger-release.keystore
      KEY_ALIAS: jointdebugger

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404

      - name: Pin .NET SDK version
        run: echo '{"sdk":{"version":"8.0.404","rollForward":"latestFeature"}}' > global.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: |
          dotnet workload install android --skip-manifest-update
          dotnet workload list

      - name: Workload restore
        run: dotnet workload restore

      - name: NuGet restore
        run: dotnet restore

      - name: Create private signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.JOINTDEBUGGER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.JOINTDEBUGGER_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: Missing GitHub Actions secrets."
            echo "Create these repository secrets before building:"
            echo "  JOINTDEBUGGER_KEYSTORE_PASSWORD"
            echo "  JOINTDEBUGGER_KEY_PASSWORD"
            exit 1
          fi

          mkdir -p "$(dirname "$KEYSTORE_FILE")"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Joint Position Debugger, OU=Development, O=JointDebugger, L=Local, ST=Local, C=VN"

          chmod 600 "$KEYSTORE_FILE"

      - name: Build and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.JOINTDEBUGGER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.JOINTDEBUGGER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf "$APK_OUTPUT_DIR"
          mkdir -p "$APK_OUTPUT_DIR"

          dotnet publish \
            -c Release \
            -f net8.0-android \
            -o "$APK_OUTPUT_DIR" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_FILE" \
            -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASSWORD" \
            -p:AndroidPackageFormat=apk

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files produced:"
          find "$APK_OUTPUT_DIR" -type f -name '*.apk' -print

          APK=$(find "$APK_OUTPUT_DIR" -type f -name '*.apk' -print -quit)
          if [[ -z "$APK" ]]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "ERROR: Android build-tools/apksigner was not found."
            exit 1
          fi

          echo "Verifying: $APK"
          "$APKSIGNER" verify --verbose "$APK"


          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/JointDebugger.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: JointDebugger-APK-signed
          path: release/JointDebugger.apk
          if-no-files-found: error
          retention-days: 14
