name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 (pin exact version)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.404

      - name: Disable .NET 10 SDK
        run: |
          echo "Available SDKs:"
          dotnet --list-sdks
          for dir in /usr/share/dotnet/sdk/10*; do
            if [ -d "$dir" ]; then
              echo "Removing $dir"
              sudo rm -rf "$dir"
            fi
          done
          echo "After cleanup:"
          dotnet --list-sdks

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: |
          dotnet workload install android --skip-manifest-update
          dotnet workload list

      - name: Workload restore
        run: dotnet workload restore

      - name: NuGet restore
        run: dotnet restore

      - name: Build APK
        run: dotnet publish -c Release -f net8.0-android -o ./output

      - name: Find APK file
        id: find_apk
        run: |
          find ./output -name "*.apk" -type f
          ls -la ./output
          APK=$(find ./output -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JointDebugger-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 7
